name: release

# Push a v<version> tag matching package.json to build the plugin tarball and
# the Chrome Web Store zip, and publish both on the GitHub release. A manual
# run on main releases package.json's version and makes its tag. Both
# extension copies sign in at the Molt Auth edge the public apps.env names
# (the apps_env input, else the MOLT_APPS_ENV repo variable); with neither,
# make dist refuses.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apps_env:
        description: The public apps.env (MOLT_AUTH_URL, MOLT_AUTH_PUBLIC_KEYS) the extension signs in with. Empty means the MOLT_APPS_ENV repo variable
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check tag matches package.json
        if: github.event_name == 'push'
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)" >&2
            exit 1
          fi

      - name: Name the apps.env
        env:
          APPS_ENV: ${{ inputs.apps_env || vars.MOLT_APPS_ENV }}
        run: |
          [ -n "$APPS_ENV" ] || { echo "::error::no apps_env input and no MOLT_APPS_ENV variable: a package without Molt Auth's edge cannot sign in"; exit 1; }
          printf '%s\n' "$APPS_ENV" > "$RUNNER_TEMP/apps.env"
          echo "MOLT_APPS_ENV=$RUNNER_TEMP/apps.env" >> "$GITHUB_ENV"

      - name: Build
        run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.tgz out/*.zip out/artifacts.json --clobber
          else
            gh release create "$tag" out/*.tgz out/*.zip out/artifacts.json --target "$GITHUB_SHA" --title "$tag" \
              --notes "Plugin tarball for Molt Code plus the Chrome extension zip."
          fi
