name: release

# Push a v<version> tag matching package.json to build the plugin tarball and
# the Chrome Web Store zip, and publish both on the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches package.json
        if: github.event_name == 'push'
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)" >&2
            exit 1
          fi

      - name: Build
        run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.tgz out/*.zip out/artifacts.json --clobber
          else
            gh release create "$tag" out/*.tgz out/*.zip out/artifacts.json --title "$tag" \
              --notes "Plugin tarball for Molt Code plus the Chrome extension zip."
          fi
