<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Molt Code</title>
    <style>
      :root { --gray-1: #fcfcfd; --gray-4: #e8e8ec; --gray-11: #60646c; --gray-12: #1c2024; --green-9: #30a46c; --red-3: #feebec; --red-11: #ce2c31; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--gray-1); color: var(--gray-12);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { width: 380px; background: white; border: 1px solid var(--gray-4); padding: 24px; }
      header { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
      header img { width: 20px; height: 20px; }
      .muted { color: var(--gray-11); font-size: 13px; }
      .ok { color: var(--green-9); font-weight: 600; }
      .error { background: var(--red-3); color: var(--red-11); padding: 8px 10px; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><img src="icons/48.png" alt="" />Molt Code</header>
      <div id="working" class="muted">Signing in…</div>
      <div id="done" hidden>
        <div class="ok" id="who"></div>
        <p class="muted">Next: click the Molt icon in the toolbar and press <b>Connect</b>. You can close this tab.</p>
      </div>
      <div id="error" class="error" hidden></div>
    </main>
    <script src="signed-in.js"></script>
  </body>
</html>
