<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pair with Molt Code</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f5fc;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1f1b2e;
      }
      main { width: 420px; background: white; border-radius: 14px; padding: 28px; box-shadow: 0 8px 30px rgba(31, 27, 46, 0.08); }
      header { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; margin-bottom: 16px; }
      header img { width: 28px; height: 28px; }
      .who { font-weight: 600; }
      .code { font: 600 34px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.2em; text-align: center; padding: 18px 0; margin: 16px 0; background: #f3f0ff; color: #5b21b6; border-radius: 10px; }
      .muted { color: #6b7280; font-size: 13px; }
      .warn { color: #b45309; background: #fffbeb; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 12px; }
      .buttons { display: flex; gap: 10px; margin-top: 20px; }
      button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; }
      #allow { background: #7c3aed; color: white; }
      #deny { background: #ede9fe; color: #5b21b6; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><img src="icons/48.png" alt="" />Pair Chrome with Molt Code</header>
      <div id="offer" hidden>
        <div><span id="who" class="who"></span> on <span id="machine" class="who"></span> wants to let its agents control this browser.</div>
        <div id="code" class="code"></div>
        <div class="muted">Allow only if Molt Code on your computer shows this same code right now.</div>
        <div id="replaces" class="warn" hidden></div>
        <div class="buttons">
          <button id="deny">Deny</button>
          <button id="allow">Allow</button>
        </div>
      </div>
      <div id="none" class="muted" hidden>There is no pair request waiting. Start pairing from Molt Code → Plugins → Browser (Chrome).</div>
    </main>
    <script src="pair.js"></script>
  </body>
</html>
